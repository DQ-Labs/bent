name: Build and release

# Every push to main and pull request runs unit tests and builds Windows executables
# (portable .exe + NSIS installer .exe) as workflow artifacts.
# Pushing a v*.*.* tag (e.g. v0.1.0) publishes a GitHub Release with the executables
# and SHA256SUMS.txt attached.

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Windows portable and installer executables
        run: npm run build -- --publish never

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = Get-ChildItem dist -File |
            Where-Object { $_.Extension -eq '.exe' -and $_.Name -like "*$version*" -and $_.Name -notlike '*builder-*' }
          if (-not $files) {
            Get-ChildItem dist -File | Format-Table Name
            throw "No Windows .exe artifacts for package.json version $version in dist"
          }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          Set-Content -Path dist/SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bent-win-${{ github.sha }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = Get-ChildItem dist -File |
            Where-Object {
              ($_.Extension -eq '.exe' -and $_.Name -like "*$version*" -and $_.Name -notlike '*builder-*') -or
              $_.Name -eq 'SHA256SUMS.txt'
            }
          if (-not ($files | Where-Object { $_.Extension -eq '.exe' })) {
            Get-ChildItem dist -File | Format-Table Name
            throw "No executables found for version $version in dist"
          }
          $flags = @('--title', "Bent $env:TAG", '--generate-notes')
          if ($env:TAG -match '-') {
            $flags += '--prerelease'
          }
          gh release create $env:TAG $files.FullName @flags
